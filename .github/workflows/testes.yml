name: Testes

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"  # toda segunda: novas vulnerabilidades aparecem sem mudar o código
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: pytest + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Instalar o Chromium do Playwright
        run: python -m playwright install --with-deps chromium
      - name: Rodar os testes
        run: python -m pytest -v --tracing retain-on-failure
      - name: Guardar o rastro dos testes de navegador que falharem
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

  auditoria:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arquivo: [requirements-dev.txt, requirements-whisper.txt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar pip-audit
        run: pip install pip-audit
      - name: Auditar ${{ matrix.arquivo }}
        run: pip-audit -r ${{ matrix.arquivo }} --progress-spinner off

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construir a imagem
        run: docker build -t video-transcriber .
      - name: Subir o container e conferir a página
        run: |
          docker run -d --name vt -p 127.0.0.1:5000:5000 video-transcriber
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5000/ia >/dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:5000/)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/historico)" = 200  # grava em /dados
          docker exec vt ffprobe -version >/dev/null
      - name: Log do container
        if: always()
        run: docker logs vt || true
